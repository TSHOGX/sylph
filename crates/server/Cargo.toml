[package]
name = "sylph-server"
version = "0.1.0"
edition = "2021"
# 1.88 rather than 1.85 because calamine 0.36 requires it. Left at 1.85 this
# manifest would claim support it does not have: the build fails outright on a
# 1.85 toolchain, and only a newer local toolchain hides that.
rust-version = "1.88"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { workspace = true }
tokio-rustls = "0.26"
rustls-pemfile = "2"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
] }

# The FTS5 tokenizer, linked in rather than loaded as a platform-specific extension.
# `docs/storage.md` § Tokenization says why static linking is the requirement rather than
# a convenience.
fts5-jieba = { path = "../fts5-jieba" }

# The event vocabulary and the adapter contract as types.
#
# A path dependency rather than a module because the adapters and the envagent link
# against it without linking against the server.
sylph-protocol = { path = "../protocol" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
# The on-disk config format. TOML rather than JSON because this file is
# hand-edited and seeded fully commented: JSON has no comments, so a seeded file
# could not explain itself, and every default would have to be duplicated into
# prose that drifts. `toml` deserializes through serde, which is already here.
toml = "1.1"

# Async utilities
futures = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
tempfile = "3.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { workspace = true }
sha2 = "0.10"
hex = "0.4"
base64 = { workspace = true }

# Content addressing and compression for the durable history tier.
#
# blake3 for the content index: collision resistance is the only property needed
# — nothing is executed or trusted on the basis of a hash — and it is several
# times faster than SHA-256 on the sizes involved. zstd because agent output is
# extremely redundant (tool output, code, diffs) and compresses 3-5x at level 3,
# which is cheap enough for the write path.
blake3 = "1.5"
zstd = "0.13"

# No `nix`. Process groups and `killpg` were `env::LocalEnvironment::spawn`'s, and
# it had one caller: the adapter subprocess. An adapter is linked in now and owns
# whatever process its vendor CLI needs, so the signalling lives in
# `crates/adapters` — which holds the `nix` dependency — rather than here.

# The `Environment` seam is dyn-dispatched: the supervisor holds a
# `dyn Environment` chosen per session at runtime, so its async methods need
# boxing that native `async fn` in traits still does not provide for trait
# objects. See `docs/environments.md`.
async-trait = { workspace = true }

# Office document parsing for the Artifacts pane.
#
# Server-side rather than in the browser: the npm alternative (SheetJS `xlsx`)
# is frozen at 0.18.5 with two unpatched High CVEs — prototype pollution
# (CVE-2023-30533) and ReDoS (CVE-2024-22363) — reachable on exactly the
# "parse a file we did not write" path this feature needs, and is 7.5 MB
# unpacked against a first-load budget with ~4 KB of headroom.
#
# `dates` pulls in chrono, already a dependency above, so it is free. It is
# what turns an Excel serial into a real date instead of the number 46112.
calamine = { version = "0.36.1", features = ["dates"] }
# Word and PowerPoint have no equivalent crate worth taking, so their XML parts
# are walked directly. Already in the tree as a calamine dependency.
quick-xml = "0.41"
csv = "1.4"
# OOXML is deflate-only, so the default features (AES, bzip2, zstd, lzma) buy
# nothing and cost ~26 transitive crates. These flags match calamine's own pin,
# so declaring zip directly adds no crates.
#
# Cargo unions features across the graph: if any future dependency enables
# zip's `aes` or `zstd`, they come back regardless of what is written here.
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
sylph-envagent = { path = "../envagent" }
# Drives the router in-process via ServiceExt::oneshot, so integration tests
# need no bound port and no spawned server.
tower = { version = "0.5", features = ["util"] }

[lib]
name = "sylph_server"
path = "src/lib.rs"

[[bin]]
name = "sylph-server"
path = "src/main.rs"

[features]
