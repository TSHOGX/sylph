[package]
name = "sylph-envagent"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
sylph-protocol = { path = "../protocol" }
sylph-adapters = { path = "../adapters" }

anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio-stream = "0.1"
uuid = { version = "1.11", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
base64 = { workspace = true }
# The on-disk config format, for the same reason the server uses it: the file is
# hand-edited and seeded commented, and JSON has no comments.
toml = "1.1"

[dev-dependencies]
tempfile = "3.14"

[features]
# Forwards to `sylph-adapters/e2e`, which compiles in the deterministic E2E agent
# **instead of** the three real ones.
#
# On the envagent rather than the server, because the envagent is the only process
# that holds an adapter (`docs/environments.md` § Every environment is an envagent).
# A feature rather than an environment variable, and that is the whole point: the
# fixture cannot be enabled on a running envagent, so a production binary has no code
# path that reaches it. `frontend/playwright.config.ts` builds the envagent with this.
e2e = ["sylph-adapters/e2e"]
