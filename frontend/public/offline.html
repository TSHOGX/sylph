<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sylph Web is offline</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14181f" />
    <!--
      Standalone, hand-written, and cached by `sw.js`.

      It cannot import the app's stylesheet: this document is served when the
      network is unreachable, so any external asset it references would fail too.
      The tokens below are therefore copies of `--canvas`/`--ink`/`--ink-muted` from
      `app/globals.css`. That duplication is the price of the page working at all,
      and it is bounded to four colours plus the font stack.

      It says what is actually wrong. A local-first app that cannot reach
      `localhost:4317` has a stopped backend, not a lost internet connection, and the
      browser's own offline page asserts the opposite.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #ffffff;
        --ink: #101828;
        --ink-muted: #4a5565;
        --line: #e5e7eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0e1016;
          --ink: #f1f2f4;
          --ink-muted: #9b9ea6;
          --line: #282b33;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--canvas);
        color: var(--ink);
        font-family:
          system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1rem;
        font-size: 0.875rem;
        line-height: 1.55;
        color: var(--ink-muted);
      }
      pre {
        margin: 0 0 1.25rem;
        padding: 0.75rem;
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.75rem;
        text-align: left;
        color: var(--ink);
      }
      button {
        min-height: 2.75rem;
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--ink);
        color: var(--canvas);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #3080ff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sylph Web cannot reach its server</h1>
      <p>
        Sylph Web runs against a backend on this machine. Nothing loads until that
        process is running &mdash; there is no offline mode, because every screen reads
        live session state.
      </p>
      <pre>cd crates/server &amp;&amp; cargo run</pre>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
